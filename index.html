<body> 
  <main class="app-shell">
    <header class="topbar">
      <button id="brandBtn" class="brand" type="button" aria-label="Volver al inicio">
        <span class="live-dot"></span>
        <span class="brand-lockup"><span class="brand-prefix">Simulador</span><span class="stream-word">Stream</span><span class="hub-word">Hub</span></span>
        <small>BA v0.91</small>
      </button>
      <div class="topbar-actions">
        <div id="topMeta" class="top-meta hidden">
          <span id="timeLabel">Año 1 · T1</span>
          <span class="separator">•</span>
          <span id="originLabel">—</span>
        </div>
        <div class="sfx-volume-control">
          <button id="sfxVolumeBtn" class="sfx-volume-btn" type="button" aria-label="Ajustar volumen de efectos" aria-expanded="false" aria-controls="sfxVolumePopover" title="Volumen de efectos">
            <svg class="sfx-volume-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.1-3.8v7.6a4.5 4.5 0 0 0 2.1-3.8Zm0-8.2v2.1a7 7 0 0 1 0 12.2v2.1a9 9 0 0 0 0-16.4Z"/></svg>
            <span class="sfx-volume-label">Sonidos</span>
          </button>
          <div id="sfxVolumePopover" class="sfx-volume-popover hidden" role="group" aria-label="Volumen de efectos de sonido">
            <div class="sfx-volume-head"><span>Volumen</span><output id="sfxVolumeValue" for="sfxVolumeRange">100%</output></div>
            <input id="sfxVolumeRange" data-sfx-volume type="range" min="0" max="100" step="5" value="100" aria-label="Volumen de efectos de sonido" />
            <div class="sfx-volume-foot"><span></span><button id="sfxMuteBtn" class="sfx-mute-btn" type="button">Silenciar</button></div>
          </div>
        </div>
      </div>
    </header>
    <section id="screen" class="screen" aria-live="polite"></section>
    <aside id="persistentAd" class="sidebar-ad-card persistent-ad-card hidden" aria-label="Publicidad"><div class="sidebar-ad-frame"><ins class="adsbygoogle" style="display:block;width:100%;height:100%" data-ad-client="ca-pub-4404300342362688" data-ad-slot="6602868067" data-ad-format="auto" data-full-width-responsive="true"></ins></div></aside>
