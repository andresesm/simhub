<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070707" />
  <title>Muy pronto</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070707;
      --fg: #f5f5f2;
      --dx: 0;
      --dy: 0;
      --px: 74%;
      --py: 50%;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
    }

    body {
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .coming-soon {
      position: relative;
      isolation: isolate;
      width: 100vw;
      min-height: 100svh;
      display: grid;
      align-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at var(--px) var(--py), rgba(255,255,255,.12), transparent 20%),
        radial-gradient(circle at 74% 50%, rgba(255,255,255,.075), transparent 31%),
        linear-gradient(115deg, #050505 0%, #090909 48%, #050505 100%);
      transition: background-position .35s ease;
    }

    .coming-soon::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -5;
      opacity: .16;
      background-image:
        linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(circle at 72% 50%, #000 0 18%, transparent 58%);
      animation: grid-drift 22s linear infinite;
    }

    .coming-soon::after {
      content: "";
      position: absolute;
      inset: auto;
      width: 32rem;
      aspect-ratio: 1;
      right: 11vw;
      top: 50%;
      transform: translateY(-50%);
      z-index: -4;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.09) 0%, rgba(255,255,255,.025) 36%, rgba(255,255,255,0) 68%);
      filter: blur(18px);
      animation: aura 7s ease-in-out infinite;
      pointer-events: none;
    }

    .orbits {
      position: absolute;
      right: 15vw;
      top: 50%;
      width: min(34vw, 520px);
      aspect-ratio: 1;
      transform: translateY(-50%);
      z-index: -3;
      pointer-events: none;
      opacity: .55;
    }

    .orbits::before,
    .orbits::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 0 0 1px rgba(255,255,255,.015) inset;
    }

    .orbits::after {
      inset: 13%;
      opacity: .7;
    }

    .orbit-dot,
    .orbit-dot::before {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      box-shadow: 0 0 18px rgba(255,255,255,.5);
      content: "";
    }

    .orbit-dot {
      width: 7px;
      height: 7px;
      left: 50%;
      top: 50%;
      margin: -3.5px;
      animation: orbit-outer 10s linear infinite;
    }

    .orbit-dot::before {
      width: 6px;
      height: 6px;
      left: 50%;
      top: 50%;
      margin: -3px;
      opacity: .75;
      animation: orbit-inner 6.8s linear infinite reverse;
    }

    .mark-wrap {
      position: absolute;
      z-index: -1;
      right: -10vw;
      top: 50%;
      width: min(72vw, 1150px);
      transform:
        translate3d(calc(var(--dx) * 14px), calc(-50% + (var(--dy) * 10px)), 0)
        rotate(-4deg);
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
      user-select: none;
      will-change: transform;
    }

    .mark-glow,
    .mark-main,
    .shine {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: auto;
    }

    .mark-glow {
      filter: invert(1) blur(10px) drop-shadow(0 0 36px rgba(255,255,255,.18));
      opacity: .28;
      animation: glow-breathe 4.8s ease-in-out infinite;
      mix-blend-mode: screen;
    }

    .mark-main {
      position: relative;
      filter: invert(1) drop-shadow(0 0 40px rgba(255,255,255,.04));
      opacity: .94;
      mix-blend-mode: screen;
      animation: tilt 7.4s ease-in-out infinite;
    }

    .shine {
      overflow: hidden;
      mix-blend-mode: screen;
      opacity: .45;
      mask-image: linear-gradient(to right, transparent 4%, black 24%, black 76%, transparent 96%);
      -webkit-mask-image: linear-gradient(to right, transparent 4%, black 24%, black 76%, transparent 96%);
    }

    .shine::before {
      content: "";
      position: absolute;
      inset: -20%;
      background: linear-gradient(115deg,
        rgba(255,255,255,0) 38%,
        rgba(255,255,255,.06) 45%,
        rgba(255,255,255,.45) 50%,
        rgba(255,255,255,.08) 55%,
        rgba(255,255,255,0) 62%);
      transform: translateX(-65%) skewX(-20deg);
      animation: sweep 5.6s cubic-bezier(.25,.1,.25,1) infinite;
    }

    .veil {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg,
          rgba(7,7,7,.98) 0%,
          rgba(7,7,7,.90) 28%,
          rgba(7,7,7,.32) 57%,
          rgba(7,7,7,.02) 100%);
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      padding-left: clamp(28px, 7vw, 120px);
      color: var(--fg);
      font-size: clamp(2.25rem, 6.4vw, 7.4rem);
      font-weight: 800;
      line-height: .9;
      letter-spacing: .16em;
      text-transform: uppercase;
      text-wrap: balance;
      text-shadow: 0 10px 50px rgba(0,0,0,.55);
      animation: reveal .9s cubic-bezier(.2,.7,.2,1) both, text-float 6s ease-in-out 1s infinite;
    }

    h1::after {
      content: "";
      display: block;
      width: clamp(70px, 8vw, 120px);
      height: 2px;
      margin-top: 28px;
      background: currentColor;
      transform-origin: left;
      animation: line 1s .35s cubic-bezier(.2,.7,.2,1) both;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(18px); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes line {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }

    @keyframes drift {
      from {
        transform: translate3d(calc(var(--dx) * 14px), calc(-50% + (var(--dy) * 10px)), 0)
          rotate(-4deg) scale(1);
      }
      to {
        transform: translate3d(calc(var(--dx) * 18px), calc(-52% + (var(--dy) * 12px)), 0)
          rotate(-2.2deg) scale(1.03);
      }
    }

    @keyframes tilt {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(.8deg) scale(1.012); }
    }

    @keyframes glow-breathe {
      0%, 100% { opacity: .18; transform: scale(.992); }
      50% { opacity: .38; transform: scale(1.022); }
    }

    @keyframes sweep {
      0%, 12% { transform: translateX(-70%) skewX(-20deg); opacity: 0; }
      20% { opacity: .8; }
      48% { transform: translateX(42%) skewX(-20deg); opacity: .7; }
      58%, 100% { transform: translateX(82%) skewX(-20deg); opacity: 0; }
    }

    @keyframes aura {
      0%, 100% { opacity: .35; transform: translateY(-50%) scale(.96); }
      50% { opacity: .7; transform: translateY(-50%) scale(1.05); }
    }

    @keyframes orbit-outer {
      from { transform: rotate(0deg) translateX(min(17vw, 260px)) rotate(0deg); }
      to { transform: rotate(360deg) translateX(min(17vw, 260px)) rotate(-360deg); }
    }

    @keyframes orbit-inner {
      from { transform: rotate(0deg) translateX(min(8vw, 125px)) rotate(0deg); }
      to { transform: rotate(360deg) translateX(min(8vw, 125px)) rotate(-360deg); }
    }

    @keyframes grid-drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(0, -52px, 0); }
    }

    @keyframes text-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @media (max-width: 720px) {
      :root {
        --px: 50%;
        --py: 42%;
      }

      .coming-soon {
        place-items: center;
        background:
          radial-gradient(circle at var(--px) var(--py), rgba(255,255,255,.1), transparent 24%),
          radial-gradient(circle at 50% 44%, rgba(255,255,255,.07), transparent 38%),
          #070707;
      }

      .coming-soon::before {
        background-size: 40px 40px;
        mask-image: radial-gradient(circle at 50% 45%, #000 0 12%, transparent 62%);
      }

      .coming-soon::after {
        right: 50%;
        top: 44%;
        width: 19rem;
        transform: translate(50%, -50%);
        animation: aura-mobile 7s ease-in-out infinite;
      }

      .orbits {
        right: 50%;
        top: 44%;
        width: min(72vw, 320px);
        transform: translate(50%, -50%);
        opacity: .45;
      }

      .mark-wrap {
        right: 50%;
        top: 44%;
        width: 138vw;
        opacity: .58;
        transform:
          translate3d(calc(50% + (var(--dx) * 8px)), calc(-50% + (var(--dy) * 6px)), 0)
          rotate(-4deg);
        animation: drift-mobile 12s ease-in-out infinite alternate;
      }

      .veil {
        background: radial-gradient(circle at 50% 44%, rgba(7,7,7,.08) 0 22%, rgba(7,7,7,.38) 56%, rgba(7,7,7,.82) 100%);
      }

      h1 {
        width: 100%;
        padding: 0 22px;
        text-align: center;
        font-size: clamp(2rem, 12vw, 4.5rem);
        letter-spacing: .12em;
      }

      h1::after {
        margin: 22px auto 0;
      }

      @keyframes drift-mobile {
        from {
          transform: translate3d(calc(50% + (var(--dx) * 8px)), calc(-50% + (var(--dy) * 6px)), 0)
            rotate(-4deg) scale(1);
        }
        to {
          transform: translate3d(calc(50% + (var(--dx) * 10px)), calc(-52% + (var(--dy) * 8px)), 0)
            rotate(-2deg) scale(1.035);
        }
      }

      @keyframes aura-mobile {
        0%, 100% { opacity: .35; transform: translate(50%, -50%) scale(.96); }
        50% { opacity: .7; transform: translate(50%, -50%) scale(1.05); }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4404300342362688" crossorigin="anonymous"></script>
</head>
<body>
  <main class="coming-soon" id="comingSoon">
    <div class="orbits" aria-hidden="true">
      <span class="orbit-dot"></span>
    </div>

    <div class="mark-wrap" aria-hidden="true">
      <img class="mark-glow" src="WSSHiso.svg" alt="" />
      <img class="mark-main" src="WSSHiso.svg" alt="" />
      <div class="shine"></div>
    </div>

    <div class="veil" aria-hidden="true"></div>
    <h1>Sim · StreamHub</h1>
  </main>

  <script>
    const root = document.documentElement;
    const main = document.getElementById('comingSoon');
    const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

    if (!mediaQuery.matches) {
      const updatePointer = (event) => {
        const rect = main.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width;
        const y = (event.clientY - rect.top) / rect.height;
        const dx = (x - 0.5).toFixed(3);
        const dy = (y - 0.5).toFixed(3);

        root.style.setProperty('--dx', dx);
        root.style.setProperty('--dy', dy);
        root.style.setProperty('--px', `${(x * 100).toFixed(2)}%`);
        root.style.setProperty('--py', `${(y * 100).toFixed(2)}%`);
      };

      const resetPointer = () => {
        root.style.setProperty('--dx', 0);
        root.style.setProperty('--dy', 0);
        root.style.setProperty('--px', window.innerWidth <= 720 ? '50%' : '74%');
        root.style.setProperty('--py', window.innerWidth <= 720 ? '42%' : '50%');
      };

      main.addEventListener('pointermove', updatePointer);
      main.addEventListener('pointerleave', resetPointer);
      window.addEventListener('resize', resetPointer);
    }
  </script>
</body>
</html>
